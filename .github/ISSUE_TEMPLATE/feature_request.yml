name: Feature request
description: Suggest a capability or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The most useful feature requests describe a **workflow that is currently painful**,
        not just a control to add. English or Portuguese are both fine.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow this would improve, and what makes it awkward today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Rough is fine — a sentence, a sketch, a screenshot from another app.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it now?
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to implement this?
      options:
        - label: I'd be up for opening a PR for this (guidance welcome)
          required: false
